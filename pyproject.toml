[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-gpt"
version = "0.4.0"
description = "Local-dev MCP sidecar for exposing selected Hermes Agent capabilities."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "hermes-gpt contributors" }
]
dependencies = [
  "mcp[cli]>=1.28,<2",
  "PyYAML",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
hermes-gpt = "server:main"

[tool.setuptools]
include-package-data = true
py-modules = [
  "server",
  "operator_policy",
  "operator_cron",
  "operator_skills",
  "operator_config",
  "operator_workspace",
  "operator_antigravity",
  "operator_diagnostics",
  "operator_manifest",
  "operator_bridge",
  "operator_agent",
  "operator_auth",
  "operator_sessions",
  "bridge_worker",
  "auth_bootstrap",
]

[tool.setuptools.data-files]
"share/hermes-gpt" = [
  "README.md",
  "pyproject.toml",
  "CHANGELOG.md",
]
"share/hermes-gpt/docs" = [
  "docs/operator-mode.md",
  "docs/release-notes-v0.2.0.md",
  "docs/release-notes-v0.3.0.md",
  "docs/release-notes-v0.4.0.md",
  "docs/file-bridge.md",
  "docs/split-endpoint-architecture.md",
  "docs/hermes-operator-approval-system.md",
  "docs/chatgpt-operator-deployment.md",
  "docs/workspace-test-runner.md",
  "docs/workspace-command-execution.md",
  "docs/hermes-operator-manifest-integrity.md",
  "docs/manifest-integrity-hardening-evidence-2026-08-04.md",
]
"share/hermes-gpt/examples" = [
  "examples/start-hermes-gpt.example.ps1",
  "examples/status-hermes-gpt.example.ps1",
  "examples/install-task.example.ps1",
  "examples/hermes-file-bridge.service",
  "examples/hermes-gpt-owner-local.service",
  "examples/hermes-gpt-sidecar-file-bridge.conf",
  "examples/hermes-gpt-sidecar-bridge.service",
  "examples/hermes-gpt-sidecar-cutover.service",
  "examples/hermes-gpt-sidecar-rollback.service",
  "examples/hermes-gpt-sidecar-cutover.timer",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-q"
norecursedirs = [".git", ".venv", "logs", "prototypes", "skill-estate"]
